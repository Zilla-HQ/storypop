<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sitebeat — SEO Audit</title>
  <style>
    body { width: 320px; margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fafafa; color: #111; }
    h1 { margin: 0 0 6px 0; font-size: 16px; font-weight: 700; }
    p.sub { margin: 0 0 16px 0; color: #555; font-size: 12px; line-height: 1.5; }
    .url { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 8px 10px; font-size: 12px; word-break: break-all; color: #444; margin-bottom: 16px; }
    button { width: 100%; padding: 10px; border-radius: 6px; border: 0; background: #059669; color: white; font-weight: 600; font-size: 13px; cursor: pointer; }
    button:hover { background: #047857; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .err { color: #b91c1c; font-size: 12px; margin-top: 10px; }
    a { color: #059669; font-size: 11px; }
    .footer { margin-top: 16px; text-align: center; font-size: 11px; color: #888; }
  </style>
</head>
<body>
  <h1>Sitebeat SEO audit</h1>
  <p class="sub">Run a free 13-point SEO audit on the current page.</p>
  <div class="url" id="url">Loading…</div>
  <button id="run">Run audit →</button>
  <div class="err" id="err" hidden></div>
  <div class="footer">
    <a href="https://sitebeat.com" target="_blank" rel="noopener">sitebeat.com</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
